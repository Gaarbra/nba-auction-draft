<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Space Grotesk/Space Mono: scoped to the redesigned landing screen only
         (see .landing-lobby in index.css), not a global type-system change. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- STIX Two Text: the equation display on the How to Play page (see
         --htp-font-math in index.css). Designed to match LaTeX's own math
         typesetting (Computer Modern/Latin Modern), which is what a formula
         actually looks like set in print instead of a code font. -->
    <link
      href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap"
