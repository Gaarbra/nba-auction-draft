name: Refresh player data

# Fetches the player pool, notable-players leaderboard, and per-player stats
# from stats.nba.com and commits the result — see
# stats-service/scripts/refresh_all.py for the actual logic and why this
# exists at all: Render's own outbound IP is confirmed blocked by
# stats.nba.com, so production can never refresh its own data. It has to
# come from somewhere else and get shipped via a normal commit + push, which
# then triggers Render's usual auto-deploy.
#
# NOT scheduled — confirmed by an actual run (2026-09-01) that GitHub-hosted
# runners are blocked too (same ReadTimeoutError signature as Render, not a
# quick rejection — stats.nba.com blackholes a lot of datacenter/cloud IP
# ranges, this one included). A cron trigger here would just email a
# guaranteed failure notice every run for no benefit. Kept as
# workflow_dispatch only, for the day this needs re-testing (stats.nba.com's
# block list isn't static) or gets pointed at a self-hosted runner on a
# machine that can actually reach it — the one thing proven to work so far.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stats-service/requirements.txt

      - name: Install stats-service dependencies
        working-directory: stats-service
        run: pip install -r requirements.txt

      - name: Refresh player pool, notable players, and stats cache
        working-directory: stats-service
        # No DATABASE_URL on purpose — this only touches the git-shipped
        # JSON caches, not Postgres, and app.py already treats a missing
        # DATABASE_URL as "skip DB persistence" everywhere, not an error.
        env:
          REFRESH_MAX_RUNTIME_SECONDS: "1200"
        run: python scripts/refresh_all.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/players.json server/data/notablePlayers.json stats-service/data/statsCache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scheduled data refresh: player pool, notable players, stats cache"
            git push
          fi
