name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm test --prefix server
      - run: node --test "client/src/**/*.test.js"
      - run: npm run build --prefix client

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stats-service/requirements.txt
      - run: pip install -r stats-service/requirements.txt pytest
      - run: python -m pytest stats-service
