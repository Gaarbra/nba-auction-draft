databases:
  # Free-tier Render Postgres. Both hoop-bids-stats-service (player/stats
  # reference data) and hoop-bids-server (draft history) write to the same
  # database — see db/schema.sql for the full schema and db.py/db.js for
  # the two services' persistence layers. Entirely optional: neither
  # service errors or degrades without it, they just skip persistence (see
  # each db module's DATABASE_URL check).
  - name: hoop-bids-db
    plan: free
    databaseName: hoop_bids
    user: hoop_bids

services:
  # Python/Flask stats microservice. Not meant to be hit directly by the
  # browser — only the Node server calls it — but Render's free web
  # services are publicly reachable by default (there's no private-only
  # free tier), so it's still worth treating its URL as something you don't
  # advertise, even without a browser-facing use for it.
  - type: web
    name: hoop-bids-stats-service
    runtime: python
    plan: free
    rootDir: stats-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      # Pinned explicitly rather than left to Render's default — that
      # default has drifted to Python versions newer than psycopg[binary]==
      # 3.2.3 has prebuilt wheels for (the actual cause of a "Requires-
      # Python" build failure otherwise), and now that scikit-learn/pandas/
      # scipy are also in requirements.txt, a well-supported, stable version
      # matters more than it used to.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hoop-bids-db
          property: connectionString

  # Node/Express/Socket.IO backend — the only service the frontend talks to.
  - type: web
    name: hoop-bids-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hoop-bids-db
          property: connectionString
      # Fill these in from the Render dashboard after the first deploy, once
      # you can see the actual URLs Render assigned the other two services
      # (Settings tab on each service). sync: false just means "don't try to
      # auto-fill this, prompt for it" — Render will ask when you apply the
      # blueprint, and you can edit it any time under this service's
      # Environment tab afterwards.
      - key: STATS_SERVICE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # Optional — set this to any random string if you want to lock down
      # POST /api/players/sync (see README's Security section). Leave unset
      # and it stays open, same as local dev.
      - key: ADMIN_TOKEN
        sync: false

  # React static build.
  - type: web
    name: hoop-bids-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the build at build time (Vite env vars aren't readable at
      # runtime) — set this to the server service's URL, same caveat as
      # above.
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
